name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations scripts
      - run: uv run python scripts/check_invariants.py
      - run: uv run python -m compileall -q app tests migrations scripts
      - run: uv run pytest -q -m "not e2e"
